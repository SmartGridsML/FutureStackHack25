services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.12.3
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api-gateway:
    build: ./services/api-gateway
    ports:
      - "3000:3000"
    environment:
      - .env  
    depends_on:
      - video-ingestion
      - video-processing
      - language-model
      - audio-processing
    volumes:
      - ./services/api-gateway:/app
      - /app/node_modules

  video-ingestion:
    build: ./services/video-ingestion
    ports:
      - "3001:3001"
    environment:
      - VIDEO_PROCESSING_URL=http://video-processing:5000
      - LANGUAGE_MODEL_URL=http://language-model:5001
      - REDIS_URL=redis://redis:6379
      - AUDIO_PROCESSING_URL=http://audio-processing:5004
    depends_on:
      - video-processing
      - language-model
      - redis
      - data-store
      - audio-processing
    volumes:
      - ./services/video-ingestion:/app
      - /app/node_modules
      - ./services/video-ingestion/uploads:/app/uploads

  video-processing:
    build: ./services/video-processing
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    expose:
      - "5000"
    depends_on:
      - redis
    volumes:
      - ./services/video-ingestion/uploads:/app/uploads

  language-model:
    build: ./services/language-model
    environment:
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY}
    expose:
      - "5001"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://localhost:3000
    depends_on:
      - api-gateway
    volumes:
      - ./frontend:/app
      - /app/node_modules

  data-store:
    build: ./services/data-store
    ports:
      - "4005:4005"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - GOOGLE_API_KEY=${GOOGLE_API_KEY} 
    depends_on:
      - qdrant
    volumes:
      - ./services/data-store:/app
      - /app/node_modules
  
  audio-processing:
    build: ./services/audio-processing
    ports:
      - "5004:5004"
    depends_on:
      - redis
    volumes:
      - ./services/video-ingestion/uploads:/app/uploads

networks:
  default:
    name: frameforge_network

volumes:
  qdrant_data: